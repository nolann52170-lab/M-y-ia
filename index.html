<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mon IA</title>

<style>
    body {
        margin: 0;
        background: #111827;
        color: white;
        font-family: Arial, sans-serif;
    }

    .app {
        max-width: 700px;
        height: 100vh;
        margin: auto;
        display: flex;
        flex-direction: column;
    }

    h1 {
        text-align: center;
        padding: 20px;
        margin: 0;
    }

    #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
    }

    .message {
        padding: 12px 16px;
        margin: 10px 0;
        border-radius: 15px;
        max-width: 80%;
        white-space: pre-wrap;
    }

    .user {
        background: #2563eb;
        margin-left: auto;
    }

    .ai {
        background: #374151;
        margin-right: auto;
    }

    .input-area {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #1f2937;
    }

    input {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 10px;
        outline: none;
        font-size: 16px;
    }

    button {
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #1d4ed8;
    }
</style>
</head>

<body>

<div class="app">

    <h1>🤖 Mon IA</h1>

    <div id="chat">
        <div class="message ai">
            Salut ! Je suis ton IA. 👋
        </div>
    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="Écris ton message..."
            onkeydown="if(event.key === 'Enter') envoyer()"
        >

        <button onclick="envoyer()">Envoyer</button>
    </div>

</div>

<script>

async function envoyer() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const texte = input.value.trim();

    if (!texte) return;

    // Message utilisateur
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = texte;

    chat.appendChild(userMessage);

    input.value = "";

    // Message temporaire
    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent = "Réflexion...";

    chat.appendChild(aiMessage);

    /*
       C'est ici que tu connecteras ton IA.

       Exemple :

       const response = await fetch("TON_SERVEUR", {
           method: "POST",
           headers: {
               "Content-Type": "application/json"
           },
           body: JSON.stringify({
               message: texte
           })
       });

       const data = await response.json();

       aiMessage.textContent = data.reponse;
    */

    // Démonstration sans vraie IA
    setTimeout(() => {

        aiMessage.textContent =
            "Tu as écrit : " + texte +
            "\n\nPour avoir une vraie IA, il faut maintenant connecter cette interface à une API.";

        chat.scrollTop = chat.scrollHeight;

    }, 700);
}

</script>

</body>
</html>
